# SPDX-License-Identifier: Apache-2.0
name: vertical-frontier

on:
  pull_request:
    paths:
      - frontier/**
      - .github/workflows/vertical-frontier.yml
  push:
    branches: [main]
    paths:
      - frontier/**
      - .github/workflows/vertical-frontier.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vertical-frontier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python, product contract, and container
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install test runner
        shell: bash
        run: python -m pip install --disable-pip-version-check --only-binary=:all: pytest==8.4.2

      - name: Compile and self-test
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile frontier/app.py
          python -I -P frontier/app.py --self-test

      - name: Run blocking product contract
        shell: bash
        run: python -m pytest -q frontier/tests

      - name: Build non-root runtime image
        shell: bash
        run: docker build --pull --tag szl-vertical-frontier:${{ github.sha }} --file frontier/Dockerfile frontier

      - name: Smoke exact container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name szl-vertical-frontier \
            --publish 127.0.0.1:17865:7860 \
            szl-vertical-frontier:${{ github.sha }}
          trap 'docker stop szl-vertical-frontier >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:17865/healthz > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/health.json').read_text())
          assert health['ok'] is True
          assert health['build']['vertical_count'] == 8
          assert health['build']['model_may_authorize'] is False
          assert health['build']['kernel_may_authorize'] is False
          assert health['build']['public_effectors_enabled'] is False
          PY
          curl --fail --silent --show-error http://127.0.0.1:17865/ > /tmp/index.html
          grep --fixed-strings 'SZL Vertical Frontier' /tmp/index.html
          curl --fail --silent --show-error http://127.0.0.1:17865/api/v1/verticals > /tmp/verticals.json
