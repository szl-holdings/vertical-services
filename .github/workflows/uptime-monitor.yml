name: Uptime Monitor

on:
  schedule:
    - cron: "17 6 * * *"  # daily 06:17 UTC (org scheduled-scan convention)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact monitor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Poll vertical-services identity and health endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://szlholdings-vertical-services.hf.space"
          FAILED=0
          paths=(
            "/healthz"
            "/api/build-info"
            "/api/source"
            "/.well-known/szl-source.json"
            "/sentra/healthz"
            "/lyte/healthz"
            "/killinchu/healthz"
            "/vessels/healthz"
            "/finance/healthz"
            "/terra/healthz"
            "/counsel/healthz"
          )
          for path in "${paths[@]}"; do
            url="${BASE}${path}"
            if curl -fsS --max-time 30 --retry 2 --retry-delay 10 "$url" > /dev/null; then
              echo "LIVE  $url"
            else
              echo "DOWN  $url"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more vertical-services identity or health endpoints are down"
            exit 1
          fi
          python tools/verify_runtime_identity.py \
            --base-url "$BASE" \
            --expected-revision "$GITHUB_SHA"
