name: Uptime Monitor

on:
  schedule:
    - cron: "17 6 * * *"  # daily 06:17 UTC (org scheduled-scan convention)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poll vertical-services healthz endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://szlholdings-vertical-services.hf.space"
          FAILED=0
          paths=(
            "/healthz"
            "/sentra/healthz"
            "/lyte/healthz"
            "/vessels/healthz"
            "/finance/healthz"
            "/terra/healthz"
            "/counsel/healthz"
          )
          for path in "${paths[@]}"; do
            url="${BASE}${path}"
            if curl -fsS --max-time 30 --retry 2 --retry-delay 10 "$url" > /dev/null; then
              echo "LIVE  $url"
            else
              echo "DOWN  $url"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more vertical-services healthz endpoints are down"
            exit 1
          fi
