# SPDX-License-Identifier: Apache-2.0
name: Finalize public product taxonomy once

"on":
  push:
    branches: [fix/public-product-taxonomy-20260904]
    paths:
      - .github/workflows/zz-finalize-public-product-taxonomy-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: finalize-public-product-taxonomy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact taxonomy branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Require exact branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/public-product-taxonomy-20260904
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Apply transaction only when old taxonomy remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '"public_space": "SZLHOLDINGS/sentra"' deploy/szl_verticals/profiles.py; then
            python scripts/apply_public_product_taxonomy.py
          fi
          grep -Fq '"product": "Killinchu · Defend"' deploy/szl_verticals/profiles.py
          grep -Fq '"public_space": "SZLHOLDINGS/killinchu"' deploy/szl_verticals/profiles.py
          grep -Fq '"immune_status": "MIGRATION_REQUIRED"' deploy/szl_verticals/profiles.py
          ! grep -Fq '"immune": "sentra"' deploy/szl_verticals/profiles.py

      - name: Install repository-owned test closure
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r requirements.txt -r requirements-test.txt
          python -m pip check

      - name: Prove internal engines and public product boundaries
        env:
          SENTRA_SIGNING_KEY: ci-taxonomy-key-not-used-in-production
          SZL_SOURCE_REVISION: ${{ github.sha }}
          SZL_STATE_PATH: /tmp/szl-taxonomy.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q deploy tools tests
          python -m pytest tests -q
          python - <<'PY'
          import sys
          sys.path.insert(0, "deploy")
          from szl_verticals.profiles import ALIASES, VERTICALS

          assert ALIASES["aegis"] == "sentra"
          assert ALIASES["defend"] == "sentra"
          assert "immune" not in ALIASES
          profile = VERTICALS["sentra"]
          assert profile["product"] == "Killinchu · Defend"
          assert profile["public_space"] == "SZLHOLDINGS/killinchu"
          assert profile["consolidation"]["sentra_status"] == "CAPABILITY_PLANE"
          assert profile["consolidation"]["aegis_status"] == "PORTFOLIO_LABEL"
          assert profile["consolidation"]["immune_status"] == "MIGRATION_REQUIRED"
          PY
          git diff --check

      - name: Remove transaction controls before review
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/apply_public_product_taxonomy.py \
            .github/workflows/zz-align-public-product-taxonomy-once.yml \
            .github/workflows/zz-finalize-public-product-taxonomy-once.yml

      - name: Commit clean review surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          git commit --signoff -m "fix(taxonomy): make Defend a Killinchu capability plane"
          git push origin "HEAD:${GITHUB_REF_NAME}"
