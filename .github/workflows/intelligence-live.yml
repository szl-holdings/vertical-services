name: Vertical intelligence live evidence

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/intelligence-live.yml
      - deploy/app.py
      - deploy/szl_verticals/intelligence.py
      - deploy/szl_verticals/showcase.py
      - deploy/szl_verticals/core.py
      - tests/test_intelligence_fabric.py
      - tests/test_live_intelligence_attestation.py
      - tools/attest_live_intelligence.py
      - docs/VERTICAL_INTELLIGENCE_FABRIC_V1.md
  # Live evidence judges the commit that was actually published. hf-space.yml
  # calls this workflow after its publish job succeeds, inside that run's
  # serialized deploy slot; a push trigger here would judge commits whose
  # deploy was superseded and that can never be served.
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate intelligence closure
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: vertical-intelligence-validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
      - name: Compile intelligence and showcase modules
        run: python -m py_compile deploy/szl_verticals/intelligence.py deploy/szl_verticals/showcase.py deploy/app.py tests/test_intelligence_fabric.py tools/attest_live_intelligence.py tests/test_live_intelligence_attestation.py

  live:
    name: Attest exact live intelligence rooms
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history lets the attester prove supersession by ancestry.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
      - name: Wait for exact deployment and attest public routes
        run: >-
          python tools/attest_live_intelligence.py
          --base-url https://szlholdings-vertical-services.hf.space
          --expected-revision "$GITHUB_SHA"
          --output artifacts/live-intelligence.json
      - name: Upload immutable live evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vertical-intelligence-live-${{ github.sha }}
          path: artifacts/live-intelligence.json
          if-no-files-found: error
          retention-days: 90
