name: Apply clean Killinchu runtime contract

on:
  push:
    branches:
      - feat/killinchu-runtime-contract-clean-20260904
    paths:
      - .github/workflows/apply-killinchu-runtime-contract-clean.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact clean branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/killinchu-runtime-contract-clean-20260904
          fetch-depth: 1

      - name: Mount the source-native authority contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path("deploy/app.py")
          text = app.read_text(encoding="utf-8")

          import_anchor = "from szl_verticals.killinchu import killinchu\n"
          imports = '''from szl_verticals.killinchu import killinchu
          from szl_verticals.killinchu_runtime_contract import (
              architecture as _szl_killinchu_architecture,
              compatibility_headers as _szl_killinchu_headers,
              lobe as _szl_killinchu_lobe,
          )
          '''
          if text.count(import_anchor) != 1:
              raise SystemExit("Killinchu import anchor drifted")
          text = text.replace(import_anchor, imports, 1)

          middleware_anchor = '''    return response


          for router in (
          '''
          middleware = '''    return response


          @app.middleware("http")
          async def killinchu_product_identity(request: Request, call_next):
              """Label compatibility responses without changing domain payloads."""
              response = await call_next(request)
              for key, value in _szl_killinchu_headers(request.url.path).items():
                  response.headers[key] = value
              return response


          for router in (
          '''
          if text.count(middleware_anchor) != 1:
              raise SystemExit("middleware anchor drifted")
          text = text.replace(middleware_anchor, middleware, 1)

          catalog_anchor = '''        "engines": CATALOG,
          '''
          catalog = '''        "engines": CATALOG,
                  "product_authority": _szl_killinchu_architecture(),
          '''
          if text.count(catalog_anchor) != 1:
              raise SystemExit("catalog anchor drifted")
          text = text.replace(catalog_anchor, catalog, 1)

          root_anchor = '''

          @app.get("/", response_class=HTMLResponse)
          '''
          routes = '''

          @app.get("/killinchu/architecture", tags=["Killinchu"])
          def killinchu_architecture() -> dict:
              """Read the canonical source contract; reachability is not model truth."""
              return _szl_killinchu_architecture()


          @app.get("/killinchu/aegis/healthz", tags=["Killinchu"])
          def killinchu_aegis_lobe() -> dict:
              return _szl_killinchu_lobe("aegis")


          @app.get("/killinchu/vessels/healthz", tags=["Killinchu"])
          def killinchu_vessels_lobe() -> dict:
              return _szl_killinchu_lobe("vessels")


          @app.get("/", response_class=HTMLResponse)
          '''
          if text.count(root_anchor) != 1:
              raise SystemExit("root-route anchor drifted")
          text = text.replace(root_anchor, routes, 1)
          app.write_text(text, encoding="utf-8", newline="\n")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          anchor = "A source-bound FastAPI operational fabric for six canonical SZL verticals.\n"
          block = '''A source-bound FastAPI operational fabric for six canonical SZL verticals.

          > **Canonical defense authority:** Killinchu is the sole public cyber-physical
          > resilience product. The `sentra` and `vessels` engines remain independently
          > testable compatibility lobes named **Defend/Aegis** and **Maritime/Vessels**;
          > they do not retain standalone product authority. See
          > [`docs/KILLINCHU_RUNTIME_CONVERGENCE.md`](docs/KILLINCHU_RUNTIME_CONVERGENCE.md).
          '''
          if text.count(anchor) != 1:
              raise SystemExit("README anchor drifted")
          readme.write_text(text.replace(anchor, block, 1), encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-killinchu-runtime-contract-clean.yml").unlink()
          PY

      - name: Prove focused and existing runtime contracts
        shell: bash
        env:
          SZL_SOURCE_REVISION: ffffffffffffffffffffffffffffffffffffffff
          SZL_STATE_PATH: /tmp/szl-vertical-services-killinchu-v2.sqlite3
          SENTRA_SIGNING_KEY: test-only-killinchu-runtime-contract-key
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r requirements.txt -r requirements-test.txt
          python -m json.tool contracts/killinchu-runtime-convergence.v2.json >/dev/null
          python -m py_compile \
            deploy/app.py \
            deploy/szl_verticals/killinchu_runtime_contract.py \
            tests/test_killinchu_runtime_convergence_v2.py
          python -m pytest -q \
            tests/test_killinchu_runtime_convergence_v2.py \
            tests/test_intelligence_fabric.py \
            tests/test_frontier_v3.py
          test ! -e .github/workflows/apply-killinchu-runtime-contract-clean.yml
          test ! -e .github/workflows/apply-killinchu-runtime-convergence-v1.yml
          test ! -e .github/workflows/finalize-killinchu-runtime-convergence-v1.yml
          test ! -e tools/apply_killinchu_runtime_convergence_v1.py
          git diff --check

      - name: Commit durable implementation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL Runtime Operator"
          git config user.email "stephenlutar2@gmail.com"
          git add deploy/app.py README.md \
            .github/workflows/apply-killinchu-runtime-contract-clean.yml
          git diff --cached --check
          git commit -m "feat(runtime): mount Killinchu product authority" \
            -m "Expose source-native architecture and lobe routes, label legacy engine responses, keep the module inside the Docker copy closure, and remove the one-shot operator." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/killinchu-runtime-contract-clean-20260904
