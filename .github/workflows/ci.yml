name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python contract suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Install runtime and test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt -r requirements-test.txt
      - name: Compile and test
        env:
          SENTRA_SIGNING_KEY: ci-contract-key-not-used-in-production
          SZL_SOURCE_REVISION: ${{ github.sha }}
          SZL_STATE_PATH: /tmp/szl-vertical-services-ci.sqlite3
        run: |
          python -m pip check
          python -m compileall -q services deploy tools tests
          python -m pytest tests -q
      - name: Build and exercise standalone finance runtime
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg SERVICE=finance --tag szl-finance:test .
          cid="$(docker run --detach --publish 127.0.0.1:7861:7860 \
            --env SZL_FINANCE_ORIGIN=fixture szl-finance:test)"
          trap 'docker logs "$cid" || true; docker rm --force "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7861/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo '::error::finance runtime did not start'; exit 1; fi
            sleep 1
          done
          python tools/verify_finance_engine.py --base-url http://127.0.0.1:7861
